<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>LoveFlix — Browse</title>
    <meta name="description" content="Browse your private video collection in an interactive gallery." />
    <meta name="author" content="LoveFlix" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LoveFlix — Browse" />
    <meta property="og:description" content="Browse your private video collection in an interactive gallery." />
    <meta property="og:site_name" content="LoveFlix" />

    <!-- Additional Meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoveFlix" />

    <!-- Robots: private authenticated app — do not index -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body class="bg-background">
    <div id="root"></div>
    <div
      id="voroforce"
      class="pointer-events-auto fixed inset-x-0 top-0 h-dvh w-screen"
      role="application"
      aria-label="Browse — 3D video grid"
      aria-describedby="voroforce-instructions"
    >
      <canvas class="h-full w-full pointer-events-none" aria-hidden="true"></canvas>
    </div>
    <!--
      This 3D grid is a visual, WebGL-only surface and is not fully operable
      by screen readers. A "Switch to list view" button (reachable via Tab)
      provides the same videos as a standard, fully accessible list — see
      app/loveflix/BrowseAccessibleNav.tsx.
    -->
    <p id="voroforce-instructions" class="sr-only">
      This is a visual 3D grid of your videos. If a tile is focused, arrow
      keys move to a neighboring tile, and Enter or Space opens the focused
      video. Scroll or pinch to zoom in and out. A "Switch to list view"
      button, reachable by tab, provides the same videos as a standard
      accessible list.
    </p>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
