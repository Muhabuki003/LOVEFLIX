    <script>
      // Remove the intro overlay from the DOM after the animation completes.
      (function(){
        var intro = document.getElementById('lf-intro');
        if (!intro) return;
        setTimeout(function(){ intro.parentNode && intro.parentNode.removeChild(intro); }, 4200);
      })();

      // Wipe ALL Open Reel / OpenReel branding (text + sun icon) from any DOM
      // node the bundle injects. Replace with LoveFlix.
      (function(){
        var rxText = /Open\s*Reel(?:\s*Video)?/gi;
        var rxLower = /openreel/gi;
        function onlyOpenReel(el){
          if (!el || el.nodeType !== 1) return false;
          var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
          return /^Open\s*Reel(?:\s*Video)?$/i.test(txt);
        }
        function scrub(node){
          if (node.nodeType === 3) {
            if (/^\s*\d{3,4}\s*[x×]\s*\d{3,4}\s*$/.test(node.nodeValue)) {
              var parent = node.parentElement;
              if (parent) parent.style.display = 'none';
            }
            if (rxText.test(node.nodeValue) || rxLower.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue
                .replace(rxText, 'LoveFlix')
                .replace(rxLower, 'loveflix');
            }
            return;
          }
          if (node.nodeType !== 1) return;
          // Strip alt / aria / title attributes that reference Open Reel.
          ['alt','title','aria-label'].forEach(function(a){
            var v = node.getAttribute && node.getAttribute(a);
            if (v && /open\s*reel/i.test(v)) {
              node.setAttribute(a, v.replace(rxText, 'LoveFlix').replace(rxLower, 'loveflix'));
            }
          });
          // Resolution-size tooltips.
          var t = node.getAttribute && node.getAttribute('title');
          if (t && (/\b\d{3,4}\s*[x×]\s*\d{3,4}\b/i.test(t) || /\b(1080|720|1920|2160|4K)\b/.test(t))) {
            node.removeAttribute('title');
          }
          // If this element's visible text is ONLY "Open Reel" / "Open Reel Video"
          // (heading on the splash, pill in the toolbar, etc.) hide the sun-icon
          // SVG that sits next to / inside it. Text gets replaced below.
          if (onlyOpenReel(node)) {
            node.querySelectorAll('svg, img').forEach(function(s){ s.style.display = 'none'; });
            // Also hide icon siblings of the matching element.
            var host = node;
            var sib = host.previousElementSibling;
            if (sib && (sib.tagName === 'SVG' || sib.tagName === 'IMG' ||
                        (sib.children.length === 1 && sib.firstElementChild &&
                         (sib.firstElementChild.tagName === 'SVG' || sib.firstElementChild.tagName === 'IMG')))) {
              sib.style.display = 'none';
            }
            sib = host.nextElementSibling;
            if (sib && (sib.tagName === 'SVG' || sib.tagName === 'IMG')) sib.style.display = 'none';
          }
          for (var i = 0; i < node.childNodes.length; i++) scrub(node.childNodes[i]);
        }
        var mo = new MutationObserver(function(muts){
          muts.forEach(function(m){
            m.addedNodes && m.addedNodes.forEach(function(n){ scrub(n); });
          });
        });
        document.addEventListener('DOMContentLoaded', function(){
          scrub(document.body);
          mo.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
    <script src="/assets/loveflix.js"></script>
  </body>
