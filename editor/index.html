    <script>
      // AudioContext autoplay-policy shim: must run BEFORE the module bundle so
      // every AudioContext the editor creates is tracked and resumed on the
      // first user gesture. Without this, browsers leave contexts created at
      // module init in the 'suspended' state and the preview plays silently.
      (function () {
        if (typeof window === 'undefined') return;
        var contexts = [];
        var hasGesture = false;
        function resumeOne(ctx) {
          if (!ctx) return;
          if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
            try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (_) {}
          }
        }
        function resumeAll() { for (var i = 0; i < contexts.length; i++) resumeOne(contexts[i]); }
        function track(ctx) {
          if (!ctx || contexts.indexOf(ctx) !== -1) return;
          contexts.push(ctx);
          if (hasGesture) resumeOne(ctx);
        }
        function wrap(orig) {
          if (!orig || orig.__lfPatched) return orig;
          function Patched() {
            var inst = arguments.length === 0 ? new orig() : new orig(arguments[0]);
            try { track(inst); } catch (_) {}
            return inst;
          }
          Patched.prototype = orig.prototype;
          Patched.__lfPatched = true;
          Patched.__lfOriginal = orig;
          return Patched;
        }
        if (window.AudioContext) window.AudioContext = wrap(window.AudioContext);
        if (window.webkitAudioContext) window.webkitAudioContext = wrap(window.webkitAudioContext);
        function onGesture() { hasGesture = true; resumeAll(); }
        ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (evt) {
          document.addEventListener(evt, onGesture, { capture: true, passive: true });
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && hasGesture) resumeAll();
        });
        window.__loveflixAudioContexts = contexts;
      })();

    <style id="loveflix-editor-overlays">
      :root {
        --lf-red: #e50914;
        --lf-red-hover: #f40612;
        --lf-red-dark: #b20710;
        --lf-bg: #141414;
        --lf-surface: #1f1f1f;
        --lf-elevated: #2a2a2a;
        --lf-border: #333333;
        --lf-text: #ffffff;
        --lf-text-muted: #b3b3b3;
      }
      /* Make room for the sticky LoveFlix header above the editor */
      body { padding-top: 48px; background: #141414; }
      #lf-header {
        position: fixed; top: 0; left: 0; right: 0; height: 48px;
        z-index: 99990;
        background: #141414; border-bottom: 1px solid #333;
        display: flex; align-items: center; gap: 12px;
        padding: 0 20px;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      }
      #lf-header .nf-logo {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 28px; color: #e50914;
        letter-spacing: 3px; line-height: 1;
        text-decoration: none; user-select: none;
        flex-shrink: 0;
      }
      #lf-header .nf-logo .heart {
        color: #fff; font-size: 20px; vertical-align: middle;
        transform: translateY(-2px); display: inline-block; margin: 0 2px;
      }
      #lf-header .lf-sep { color: #555; font-size: 13px; }
      #lf-header .lf-label { color: #b3b3b3; font-size: 13px; letter-spacing: 0.04em; }
      #lf-header .lf-back {
        margin-left: auto; display: inline-flex; align-items: center;
        gap: 6px; color: #b3b3b3; font-size: 13px;
        text-decoration: none; padding: 6px 12px;
        border-radius: 4px; border: 1px solid #333;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      #lf-header .lf-back:hover { color: #fff; border-color: #666; background: #1f1f1f; }
      #lf-header .lf-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

      /* Ensure toolbar hover tooltips are visible above all panels and never
         clipped by overflow:hidden ancestors. The runtime scrubber strips
         resolution-style title attributes ("1080x1920", etc.) so those
         specific tooltips never render — keeping useful button labels. */
      [data-radix-tooltip-content],
      [role="tooltip"] {
        z-index: 100000 !important;
        pointer-events: none;
      }

      /* Hide the bundle's own header strip (duplicate "Back to Dashboard" link). */
      div[style*="min-height: 40px"]:has(> a[href="/admin.html"]),
      div[style*="minHeight: 40px"]:has(> a[href="/admin.html"]) {
        display: none !important;
      }

      /* Intro animation — matches site-wide LoveFlix branding */
      #lf-intro {
        position: fixed; inset: 0; z-index: 99999;
        background: #000; display: flex; align-items: center; justify-content: center;
        animation: lf-intro-fade 2.8s ease forwards;
      }
      #lf-intro .lf-mark {
        font-family: 'Bebas Neue', sans-serif;
        color: #e50914; font-size: 96px; letter-spacing: 8px; line-height: 1;
        text-shadow: 0 0 40px rgba(229,9,20,0.6), 0 0 90px rgba(229,9,20,0.35);
        animation: lf-mark-zoom 2.8s ease forwards;
      }
      #lf-intro .lf-mark .heart {
        color: #fff; font-size: 64px; vertical-align: middle;
        transform: translateY(-6px); display: inline-block; margin: 0 6px;
        animation: lf-heart-beat 1.4s ease-in-out infinite;
      }
      @keyframes lf-intro-fade {
        0%, 75% { opacity: 1; }
        100% { opacity: 0; pointer-events: none; visibility: hidden; }

      @keyframes lf-mark-zoom {
        0%   { transform: scale(0.85); opacity: 0; letter-spacing: 24px; }
        25%  { opacity: 1; letter-spacing: 8px; }
        70%  { transform: scale(1.0); opacity: 1; }
        100% { transform: scale(1.12); opacity: 0; }
      }
      @keyframes lf-heart-beat {
        0%, 100% { transform: translateY(-6px) scale(1); }
        20%      { transform: translateY(-6px) scale(1.18); }
        40%      { transform: translateY(-6px) scale(1); }
        60%      { transform: translateY(-6px) scale(1.1); }

    <script>
      // Remove the intro overlay from the DOM after the animation completes.
      (function(){
        var intro = document.getElementById('lf-intro');
        if (!intro) return;
        setTimeout(function(){ intro.parentNode && intro.parentNode.removeChild(intro); }, 3000);
      })();

      // Strip lingering OpenReel/Open Reel branding from any DOM node the bundle injects.
      (function(){
        var rxText = /\bOpen\s*Reel(?:\s*Video)?\b/gi;
        function isBrandingRoot(el){
          if (!el || el.nodeType !== 1) return false;
          var txt = (el.textContent || '').trim();
          // Match the toolbar branding pill: "Open Reel" / "Open Reel Video" with little else.
          return /^Open\s*Reel(?:\s*Video)?$/i.test(txt);
        }
        function scrub(node){
          if (node.nodeType === 3) {
            if (/^\s*\d{3,4}\s*[x×]\s*\d{3,4}\s*$/.test(node.nodeValue)) {
              var parent = node.parentElement;
              if (parent) parent.style.display = 'none';
            }
            if (rxText.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(rxText, 'LoveFlix');
            }
            return;
          }
          if (node.nodeType !== 1) return;
          // Hide the toolbar branding container (logo icon + "Open Reel" label).
          if (isBrandingRoot(node)) {
            var host = node.closest('a,button,div,span') || node;
            // Walk up to the smallest container that includes the adjacent icon.
            var p = host.parentElement;
            if (p && p.children.length <= 3 && /open\s*reel/i.test(p.textContent || '')) host = p;
            host.style.display = 'none';
          }
          // Remove tooltip attributes from resolution/size pickers only.
          var t = node.getAttribute && node.getAttribute('title');
          if (t && (/\b\d{3,4}\s*[x×]\s*\d{3,4}\b/i.test(t) || /\b(1080|720|1920|2160|4K)\b/.test(t))) {
            node.removeAttribute('title');
          }
          for (var i = 0; i < node.childNodes.length; i++) scrub(node.childNodes[i]);
        }
        var mo = new MutationObserver(function(muts){
          muts.forEach(function(m){
            m.addedNodes && m.addedNodes.forEach(function(n){ scrub(n); });
          });
        });
        document.addEventListener('DOMContentLoaded', function(){
          scrub(document.body);
          mo.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
