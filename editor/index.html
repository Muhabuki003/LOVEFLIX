    <script>
      // AudioContext autoplay-policy shim: must run BEFORE the module bundle so
      // every AudioContext the editor creates is tracked and resumed on the
      // first user gesture. Without this, browsers leave contexts created at
      // module init in the 'suspended' state and the preview plays silently.
      (function () {
        if (typeof window === 'undefined') return;
        var contexts = [];
        var hasGesture = false;
        function resumeOne(ctx) {
          if (!ctx) return;
          if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
            try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (_) {}
          }
        }
        function resumeAll() { for (var i = 0; i < contexts.length; i++) resumeOne(contexts[i]); }
        function track(ctx) {
          if (!ctx || contexts.indexOf(ctx) !== -1) return;
          contexts.push(ctx);
          if (hasGesture) resumeOne(ctx);
        }
        function wrap(orig) {
          if (!orig || orig.__lfPatched) return orig;
          function Patched() {
            var inst = arguments.length === 0 ? new orig() : new orig(arguments[0]);
            try { track(inst); } catch (_) {}
            return inst;
          }
          Patched.prototype = orig.prototype;
          Patched.__lfPatched = true;
          Patched.__lfOriginal = orig;
          return Patched;
        }
        if (window.AudioContext) window.AudioContext = wrap(window.AudioContext);
        if (window.webkitAudioContext) window.webkitAudioContext = wrap(window.webkitAudioContext);
        function onGesture() { hasGesture = true; resumeAll(); }
        ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (evt) {
          document.addEventListener(evt, onGesture, { capture: true, passive: true });
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && hasGesture) resumeAll();
        });
        window.__loveflixAudioContexts = contexts;
      })();

    <style id="loveflix-editor-overlays">
      :root {
        --lf-red: #e50914;
        --lf-red-hover: #f40612;
        --lf-red-dark: #b20710;
        --lf-bg: #141414;
        --lf-surface: #1f1f1f;

        --lf-border: #333333;

      /* Make room for the sticky LoveFlix header above the editor */
      body { padding-top: 48px; background: #141414; }
      #lf-header {
        position: fixed; top: 0; left: 0; right: 0; height: 48px;
        z-index: 99990;
        background: #141414; border-bottom: 1px solid #333;
        display: flex; align-items: center; gap: 12px;
        padding: 0 20px;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      #lf-header .lf-logo {
        width: 32px; height: 32px; border-radius: 6px;
        background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 20px; color: #fff;
        font-family: 'Arial Black', Arial, sans-serif;
        letter-spacing: -1px; flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(229,9,20,0.4);
        user-select: none;
      }
      #lf-header .lf-wordmark {
        color: #fff; font-weight: 700; font-size: 15px;
        letter-spacing: 0.04em;
      }
      #lf-header .lf-sep { color: #555; font-size: 13px; }
      #lf-header .lf-label { color: #b3b3b3; font-size: 13px; }
      #lf-header .lf-back {
        margin-left: auto; display: inline-flex; align-items: center;
        gap: 6px; color: #b3b3b3; font-size: 13px;
        text-decoration: none; padding: 6px 12px;
        border-radius: 4px; border: 1px solid #333;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      #lf-header .lf-back:hover { color: #fff; border-color: #666; background: #1f1f1f; }
      #lf-header .lf-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

      /* Hide hover tooltips on resolution/size pickers */
      [data-tooltip][title*="x"]::after,
      [data-radix-tooltip-content] { display: none !important; }
      button[title^="Custom"], button[title*=" × "], button[title*="x1080"], button[title*="x1920"] { }
      button[title*=" × "]:hover::after,
      button[title*="x1080"]:hover::after,
      button[title*="x1920"]:hover::after { display: none !important; }

      /* Intro animation */
      #lf-intro {
        position: fixed; inset: 0; z-index: 99999;
        background: #000; display: flex; align-items: center; justify-content: center;
        animation: lf-intro-fade 2.8s ease forwards;
      }
      #lf-intro .lf-flash {
        position: absolute; inset: 0; background: #e50914;
        animation: lf-red-flash 2.8s ease forwards;
      }
      #lf-intro .lf-stage {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        animation: lf-logo-scale 2.8s ease forwards;
        position: relative; z-index: 1;

      @keyframes lf-intro-fade {

      @keyframes lf-logo-scale {

        30%  { transform: scale(1.08); opacity: 1; }

        100% { transform: scale(1.15); opacity: 0; }

      @keyframes lf-text-appear {

    <script>
      // Remove the intro overlay from the DOM after the animation completes.
      (function(){
        var intro = document.getElementById('lf-intro');
        if (!intro) return;
        setTimeout(function(){ intro.parentNode && intro.parentNode.removeChild(intro); }, 3000);
      })();

      // Strip lingering OpenReel branding from any DOM node the bundle injects.
      (function(){
        var rxText = /\bOpenReel\b/g;
        var rxLow  = /\bopenreel\b/g;
        function scrub(node){
          if (node.nodeType === 3) {
            if (rxText.test(node.nodeValue) || rxLow.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(rxText, 'LoveFlix').replace(rxLow, 'loveflix');
            }
            return;
          }
          if (node.nodeType !== 1) return;
          // Remove tooltip attributes from resolution/size pickers
          var t = node.getAttribute && node.getAttribute('title');
          if (t && (/\b\d{3,4}\s*[x×]\s*\d{3,4}\b/i.test(t) || /\b(1080|720|1920|2160|4K)\b/.test(t))) {
            node.removeAttribute('title');
          }
          for (var i = 0; i < node.childNodes.length; i++) scrub(node.childNodes[i]);
        }
        var mo = new MutationObserver(function(muts){
          muts.forEach(function(m){
            m.addedNodes && m.addedNodes.forEach(function(n){ scrub(n); });
          });
        });
        document.addEventListener('DOMContentLoaded', function(){
          scrub(document.body);
          mo.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
