<meta charset="UTF-8">
<title>LoveFlix — Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#e50914; }
  html, body { height:100%; }
  body {
    font-family:'Inter',system-ui,sans-serif; background:#000; color:#fff;
    overflow:hidden; -webkit-font-smoothing:antialiased; cursor: default;
  }
  body.cursor-hidden { cursor: none; }
  body.cursor-hidden .ui { pointer-events: none; opacity: 0; }

  .stage { position: fixed; inset: 0; background: #000; }
  #videoEl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  .stage.fallback #videoEl { display: none; }

  /* Placeholder when video URL is missing or broken */
  .placeholder {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #000; text-align: center; padding: 40px;
  }
  .stage.fallback .placeholder { display: flex; }
  .placeholder .nf-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px; color: var(--red);
    letter-spacing: 4px; line-height: 1; margin-bottom: 24px;
  }
  .placeholder .nf-logo .heart { color: #fff; font-size: 44px; vertical-align: middle; margin: 0 4px; }
  .placeholder .msg {
    font-size: 18px; color: rgba(255,255,255,0.75);
    letter-spacing: 0.3px;
  }

  .paused-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(20,20,20,0.7); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  .paused-badge.show { opacity: 1; }
  .paused-badge svg { width: 56px; height: 56px; fill: #fff; }

  .ui { transition: opacity 0.3s ease; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 22px 36px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    display: flex; align-items: center; gap: 18px;
  }
  .back-btn {
    background: none; border: none; color: #fff;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s ease; border-radius: 50%;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); }
  .back-btn svg { width: 28px; height: 28px; fill: #fff; }
  .topbar-title { font-size: 17px; font-weight: 500; color: rgba(255,255,255,0.9); }
  .topbar-eyebrow {
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px;
  }

  .controls {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 24px 36px 28px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
  }
  .scrub {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    color: rgba(255,255,255,0.85);
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .scrub-track {
    flex: 1; height: 4px; background: rgba(255,255,255,0.25);
    border-radius: 2px; cursor: pointer; position: relative;
  }
  .scrub-fill {
    height: 100%; width: 0%; background: var(--red);
    border-radius: 2px; position: relative; transition: width 0.1s linear;
  }
  .scrub-fill::after {
    content: ''; position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; background: var(--red); border-radius: 50%;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .scrub-track:hover .scrub-fill::after { opacity: 1; }
  .scrub-track:hover { height: 6px; }

  .ctrl-row { display: flex; align-items: center; gap: 22px; }
  .ctrl-left, .ctrl-right { display: flex; align-items: center; gap: 22px; }
  .ctrl-right { margin-left: auto; }

  .ctrl-btn {
    background: none; border: none; color: #fff;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.12s ease, color 0.15s ease;
    position: relative;
  }
  .ctrl-btn:hover { transform: scale(1.15); }
  .ctrl-btn svg { width: 28px; height: 28px; fill: #fff; }
  .ctrl-btn.play svg { width: 32px; height: 32px; }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .ctrl-btn:disabled:hover { transform: none; }
  .ctrl-btn.toggle.on svg { fill: var(--red); }
  .ctrl-tooltip {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); color: #000;
    font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 3px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .ctrl-btn:hover .ctrl-tooltip { opacity: 1; }
  @media (hover: none) { .ctrl-btn:hover .ctrl-tooltip { opacity: 0; } }

  .autoplay-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: rgba(255,255,255,0.85);
    letter-spacing: 1px; text-transform: uppercase;
  }

  .ep-meta { display: flex; flex-direction: column; margin-left: 8px; }
  .ep-meta .e { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
  .ep-meta .t { font-size: 15px; font-weight: 500; }

  .vol-wrap { display: flex; align-items: center; gap: 8px; }
  .vol-track {
    width: 0; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;
    overflow: hidden; transition: width 0.25s ease;
  }
  .vol-fill { height: 100%; width: 100%; background: #fff; }
  .vol-wrap:hover .vol-track { width: 80px; }

  /* next-up card */
  .next-up {
    position: fixed; right: 36px; bottom: 130px;
    width: 380px;
    background: rgba(20,20,20,0.96); backdrop-filter: blur(12px);

    pointer-events: none;

  .next-up.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .next-up-thumb {

  .next-up-thumb::after {

  .next-up-desc { font-size: 13px; color: #b3b3b3; line-height: 1.5; margin-bottom: 14px; }
  .next-up-actions { display: flex; gap: 10px; }
  .next-btn {

    .next-up { right: 10px; left: 10px; width: auto; bottom: 110px; }

    .next-up-thumb-text { font-size: 22px; }
    .next-up-body { padding: 14px 16px 16px; }

    .ctrl-btn svg { width: 22px; height: 22px; }

    .placeholder .msg { font-size: 14px; }

<script>
(async function () {
  if (!LoveFlix.requireAuth()) return;

  const stage = document.getElementById('stage');
  const video = document.getElementById('videoEl');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const playTip = document.getElementById('playTip');
  const fill = document.getElementById('scrubFill');
  const track = document.getElementById('scrubTrack');
  const cur = document.getElementById('curTime');
  const total = document.getElementById('totalTime');
  const pausedBadge = document.getElementById('pausedBadge');
  const nextUp = document.getElementById('nextUp');
  const volFill = document.getElementById('volFill');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');

  function fmt(s) {
    if (!isFinite(s) || s < 0) return '00:00';
    s = Math.floor(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const pad = n => n.toString().padStart(2, '0');
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // --- Load video by id ----------------------------------------------------
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  let videoData = null;
  let allVideos = [];
  try {
    const list = await LoveFlix.api('/api/videos');
    allVideos = list.videos || [];
  } catch (e) {
    console.error('Failed to load videos:', e);
  }

  if (id) {
    try {
      const r = await LoveFlix.api(`/api/videos/${encodeURIComponent(id)}`);
      videoData = r.video;
    } catch (_) {
      videoData = allVideos.find(v => v.id === id) || null;
    }
  } else if (allVideos.length) {
    videoData = allVideos[0];
  }

  // Topbar text
  document.getElementById('topTitle').textContent = videoData ? (videoData.title || 'Untitled') : 'No video selected';
  document.getElementById('nowPlaying').textContent = videoData ? (videoData.title || 'Untitled') : '—';

  // Show placeholder when there is no playable URL.
  const url = videoData && videoData.video_url ? videoData.video_url : '';
  if (!url) {
    stage.classList.add('fallback');
  } else {
    video.src = url;
  }

  // --- Watch progress ------------------------------------------------------
  let progressById = {};
  try {
    const r = await LoveFlix.api('/api/progress');
    (r.progress || []).forEach(p => { progressById[p.video_id] = p; });
  } catch (_) {}

  const existing = videoData && progressById[videoData.id];
  if (existing && existing.progress_seconds && !existing.completed) {
    video.addEventListener('loadedmetadata', () => {
      try { video.currentTime = Math.max(0, existing.progress_seconds - 2); } catch (_) {}
    }, { once: true });
  }

  let lastSavedAt = 0;
  async function saveProgress(force) {
    if (!videoData) return;
    if (!isFinite(video.duration) || video.duration <= 0) return;
    const now = Date.now();
    if (!force && now - lastSavedAt < 5000) return;
    lastSavedAt = now;
    const completed = video.duration > 0 && video.currentTime >= video.duration - 1;
    try {
      await LoveFlix.api('/api/progress', {
        method: 'POST',
        body: {
          video_id: videoData.id,
          progress_seconds: Math.floor(video.currentTime),
          completed: !!completed,
        },
      });
    } catch (_) { /* keep playing even if save fails */ }
  }

  // --- Prev / Next + Autoplay ---------------------------------------------
  const currentIdx = videoData ? allVideos.findIndex(v => v.id === videoData.id) : -1;
  const nextVideo = currentIdx >= 0 ? (allVideos[currentIdx + 1] || null) : (allVideos[0] || null);
  const prevVideo = currentIdx > 0 ? allVideos[currentIdx - 1] : null;

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevVideo) {
    prevBtn.disabled = false;
    prevBtn.addEventListener('click', () => location.href = `player.html?id=${encodeURIComponent(prevVideo.id)}`);
  }
  if (nextVideo) {
    nextBtn.disabled = false;
    nextBtn.addEventListener('click', () => location.href = `player.html?id=${encodeURIComponent(nextVideo.id)}`);
  }

  const AUTOPLAY_KEY = 'loveflix_autoplay';
  let autoplayOn = localStorage.getItem(AUTOPLAY_KEY) !== '0';
  const autoplayBtn = document.getElementById('autoplayBtn');
  const autoplayTip = document.getElementById('autoplayTip');
  function paintAutoplay() {
    autoplayBtn.classList.toggle('on', autoplayOn);
    autoplayTip.textContent = 'Autoplay: ' + (autoplayOn ? 'On' : 'Off');
    autoplayBtn.setAttribute('aria-pressed', String(autoplayOn));
  }
  autoplayBtn.addEventListener('click', () => {
    autoplayOn = !autoplayOn;
    localStorage.setItem(AUTOPLAY_KEY, autoplayOn ? '1' : '0');
    paintAutoplay();
  });
  paintAutoplay();

  // --- Next-up card --------------------------------------------------------
  if (nextVideo) {
    document.getElementById('nextTitle').textContent = nextVideo.title || 'Up Next';
    document.getElementById('nextDesc').textContent = nextVideo.description || '';
    document.getElementById('nextThumbText').innerHTML = escapeHtml(nextVideo.title || '').replace(/ · /, '<br>');
    if (nextVideo.thumbnail_url) {
      document.getElementById('nextThumb').style.backgroundImage = `url('${nextVideo.thumbnail_url}')`;
    }
  }

  let nextUpDismissed = false;
  document.getElementById('playNext').addEventListener('click', () => {
    if (nextVideo) location.href = `player.html?id=${encodeURIComponent(nextVideo.id)}`;
  });
  document.getElementById('cancelNext').addEventListener('click', () => {
    nextUp.classList.remove('show');
    nextUpDismissed = true;
  });

  // --- Custom controls -----------------------------------------------------
  function setPlayingUI(playing) {
    if (playing) {
      playIcon.innerHTML = '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
      playTip.textContent = 'Pause (k)';
      pausedBadge.classList.remove('show');
    } else {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      playTip.textContent = 'Play (k)';
      pausedBadge.classList.add('show');
    }
  }

  function togglePlay() {
    if (!url) return;
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }

  playBtn.addEventListener('click', togglePlay);
  stage.addEventListener('click', e => {
    if (e.target.closest('.ui') || e.target.closest('.next-up')) return;
    togglePlay();
  });

  video.addEventListener('play', () => setPlayingUI(true));
  video.addEventListener('pause', () => setPlayingUI(false));
  video.addEventListener('error', () => stage.classList.add('fallback'));

  video.addEventListener('loadedmetadata', () => {
    total.textContent = fmt(video.duration);
  });

  // Show the Up Next card only in the final stretch of the video — and
  // never longer than ~15s of content. For very short clips, fall back to
  // 25% of remaining time so it still has time to appear.
  function nextUpThreshold(d) {
    if (!isFinite(d) || d <= 0) return 10;
    if (d < 30) return Math.max(3, d * 0.25);
    if (d < 90) return 8;
    return 12;
  }

  video.addEventListener('timeupdate', () => {
    const d = video.duration || 0;
    const c = video.currentTime || 0;
    cur.textContent = fmt(c);
    if (d > 0) fill.style.width = ((c / d) * 100) + '%';
    saveProgress(false);

    if (!nextVideo) return;
    const threshold = nextUpThreshold(d);
    const remaining = d - c;
    if (d > 0 && remaining <= threshold && remaining > 0 && !nextUpDismissed && !nextUp.classList.contains('show')) {
      nextUp.classList.add('show');
    }
    // If the user scrubs back well before the threshold, allow the card
    // to re-appear next time it gets close to the end.
    if (d > 0 && remaining > threshold + 10) {
      nextUp.classList.remove('show');
      nextUpDismissed = false;
    }
  });

  video.addEventListener('ended', async () => {
    await saveProgress(true);
    if (autoplayOn && nextVideo) {
      // Pass noIntro=1 so the next page skips the intro animation and starts
      // playing immediately — avoiding the autoplay-policy block that can occur
      // after a 4-second delay on mobile.
      location.href = `player.html?id=${encodeURIComponent(nextVideo.id)}&noIntro=1`;
    } else if (autoplayOn && !nextVideo) {
      location.href = `outro_credits.html?preview=1`;
    }
  });

  track.addEventListener('click', e => {
    if (!isFinite(video.duration) || video.duration <= 0) return;
    const r = track.getBoundingClientRect();
    const p = (e.clientX - r.left) / r.width;
    video.currentTime = Math.max(0, Math.min(video.duration, p * video.duration));
  });

  document.getElementById('back10').addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  document.getElementById('fwd10').addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

  // Volume
  function paintVol() {
    volFill.style.width = (video.muted ? 0 : video.volume) * 100 + '%';
  }
  muteBtn.addEventListener('click', () => { video.muted = !video.muted; paintVol(); });
  video.addEventListener('volumechange', paintVol);
  paintVol();

  // Fullscreen — mobile-aware: prefer video-element fullscreen (works on iOS) and
  // lock to landscape via the Screen Orientation API where available.
  let isFullscreen = false;

  function updateFsIcon() {
    fsBtn.querySelector('svg').innerHTML = isFullscreen
      ? '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'
      : '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
  }

  async function enterFullscreen() {
    try {
      if (video.requestFullscreen) {
        await video.requestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        // iOS Safari native video fullscreen
        video.webkitEnterFullscreen();
        isFullscreen = true;
        updateFsIcon();
        if (typeof StatusBar !== 'undefined') StatusBar.hide();
        return;
      } else {
        await document.documentElement.requestFullscreen();
      }
      try { await screen.orientation.lock('landscape'); } catch (_) {}
      isFullscreen = true;
      updateFsIcon();
      if (typeof StatusBar !== 'undefined') StatusBar.hide();
    } catch (_) {}
  }

  async function exitFullscreen() {
    try {
      if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
      try { screen.orientation.unlock(); } catch (_) {}
      isFullscreen = false;
      updateFsIcon();
      if (typeof StatusBar !== 'undefined') StatusBar.show();
    } catch (_) {}
  }

  fsBtn.addEventListener('click', () => {
    if (!isFullscreen) enterFullscreen();
    else exitFullscreen();
  });

  // Sync state when fullscreen exits via Escape / browser UI
  document.addEventListener('fullscreenchange', () => {
    isFullscreen = !!document.fullscreenElement;
    if (!isFullscreen) { try { screen.orientation.unlock(); } catch (_) {} }
    updateFsIcon();
  });
  document.addEventListener('webkitfullscreenchange', () => {
    isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    updateFsIcon();
  });
  // iOS: fired when the native player is dismissed
  video.addEventListener('webkitendfullscreen', () => {
    isFullscreen = false;
    try { screen.orientation.unlock(); } catch (_) {}
    updateFsIcon();
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === ' ' || e.key.toLowerCase() === 'k') { togglePlay(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 10); }
    else if (e.key === 'ArrowRight') { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); }
    else if (e.key.toLowerCase() === 'f') { fsBtn.click(); }
    else if (e.key.toLowerCase() === 'm') { muteBtn.click(); }
    else if (e.key === 'Escape') { if (!document.fullscreenElement) location.href = 'home.html'; }
  });

  // Save on exit
  window.addEventListener('pagehide', () => saveProgress(true));
  window.addEventListener('beforeunload', () => saveProgress(true));

  // Hide cursor when idle
  let idle;
  function wake() {
    document.body.classList.remove('cursor-hidden');
    clearTimeout(idle);
    idle = setTimeout(() => { if (!video.paused) document.body.classList.add('cursor-hidden'); }, 2800);
  }
  document.addEventListener('mousemove', wake);
  wake();

  // Play the L intro animation, then start the video. The intro is ~4.2s
  // (0.5s delay + 3.5s zoom-in, with a small buffer so the zoom fully
  // fills the screen before fading out).
  // Skipped when: user disabled it in Settings, or the page was opened by
  // the autoplay engine (noIntro=1), both of which also avoid the mobile
  // autoplay-policy block that happens after long delays.
  const INTRO_ANIM_KEY = 'loveflix_intro_anim';
  const showIntroAnim = localStorage.getItem(INTRO_ANIM_KEY) !== '0';
  const noIntroParam  = params.get('noIntro') === '1';

  const lIntroOverlay = document.getElementById('lIntroOverlay');
  const lIntroAudio   = document.getElementById('lf-intro-audio');
  const L_INTRO_DURATION = 4200;

  if (!showIntroAnim || noIntroParam) {
    // Skip overlay entirely and start playback right away
    if (lIntroOverlay) lIntroOverlay.remove();
    if (url) startPlayback();
  } else {
    if (lIntroAudio) {
      lIntroAudio.currentTime = 0;
      lIntroAudio.volume = 1;
      var p = lIntroAudio.play();
      if (p && p.catch) p.catch(function(){});
    }
    setTimeout(() => {
      if (lIntroOverlay) {
        lIntroOverlay.classList.add('fade-out');
        setTimeout(() => lIntroOverlay.remove(), 400);
      }
      if (url) startPlayback();
    }, L_INTRO_DURATION);
  }

  // Robust autoplay: browsers block unmuted autoplay after a navigation, so
  // fall back to muted playback if the first attempt is rejected. The user
  // can unmute via the mute button or "m" once it's playing.
  async function startPlayback() {
    try {
      await video.play();
    } catch (_) {
      try {
        video.muted = true;
        paintVol();
        await video.play();
      } catch (__) {
        setPlayingUI(false);
      }
    }
  }
})();
</script>
</body>
</html>
