<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LoveFlix — Browse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#141414;--red:#e50914;--text-dim:#a3a3a3;--text-light:#d4d4d4}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}

  nav.topnav{position:fixed;top:0;left:0;right:0;padding:18px 48px;z-index:50;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,0.95)}
  .nav-left{display:flex;align-items:center;gap:40px}
  .nf-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--red);letter-spacing:3px;line-height:1}
  .nf-logo .heart{color:#fff;font-size:24px;vertical-align:middle;margin:0 2px;display:inline-block;transform:translateY(-2px)}
  .nav-links{display:flex;gap:22px}
  .nav-links a{font-size:14px;color:var(--text-light);transition:color .18s}
  .nav-links a:hover{color:#fff}
  .nav-links a.active{color:#fff;font-weight:600}
  .nav-right{display:flex;align-items:center;gap:18px}
  .nav-avatar{width:32px;height:32px;border-radius:4px;background:radial-gradient(circle at 30% 25%,#ffb3c7 0%,transparent 55%),linear-gradient(135deg,#ff5f8f 0%,#d6336c 55%,#8f1d4a 100%);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px}

  .page{padding:120px 48px 80px;max-width:1600px;margin:0 auto}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:32px}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:2px;line-height:1}
  .page-sub{font-size:14px;color:var(--text-dim);margin-top:8px}

  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    color:var(--text-light);padding:8px 16px;border-radius:999px;font-size:13px;
    transition:all .15s ease
  }
  .chip:hover{border-color:rgba(255,255,255,0.4);color:#fff}
  .chip.active{background:#fff;color:#000;border-color:#fff;font-weight:600}

  .search{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    border-radius:4px;padding:8px 12px;width:240px;
    transition:border-color .15s ease
  }
  .search:focus-within{border-color:#fff}
  .search svg{width:16px;height:16px;fill:var(--text-dim)}
  .search input{background:none;border:none;outline:none;color:#fff;font:inherit;font-size:13px;flex:1}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}

  .card{
    border-radius:6px;overflow:hidden;background:#1f1f1f;cursor:pointer;
    transition:transform .25s ease,box-shadow .25s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,0.5)}

  .card-thumb{aspect-ratio:16/9;background:var(--thumb,linear-gradient(135deg,#444,#222));position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}
  .card-thumb-text{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:rgba(255,255,255,0.92);text-shadow:0 2px 12px rgba(0,0,0,0.5);line-height:1.05}
  .card-thumb-date{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.4);padding:3px 7px;border-radius:2px}
  .card-thumb-fav{position:absolute;top:10px;right:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
  .card-thumb-fav svg{width:18px;height:18px;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6))}
  .card-thumb-dur{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.65);color:#fff;font-size:11px;font-weight:500;padding:2px 7px;border-radius:2px}

  .card-body{padding:14px 14px 16px}
  .card-title{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.3}
  .card-meta{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-cat{color:var(--red);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:10px}

  /* tints */
  .t-rose{--thumb:linear-gradient(135deg,#ff7aa2,#5a0a23)}
  .t-rose2{--thumb:linear-gradient(135deg,#d6336c,#4a0e2c)}
  .t-blue{--thumb:linear-gradient(135deg,#3a7bff,#1e3a8a)}
  .t-blue2{--thumb:linear-gradient(135deg,#0ea5e9,#082f49)}
  .t-violet{--thumb:linear-gradient(135deg,#a855f7,#2e1065)}
  .t-amber{--thumb:linear-gradient(135deg,#f59e0b,#6b3a02)}
  .t-emerald{--thumb:linear-gradient(135deg,#10b981,#064e3b)}
  .t-coral{--thumb:linear-gradient(135deg,#ff8c69,#3d0f08)}
  .t-mauve{--thumb:linear-gradient(135deg,#c084fc,#2e0a4d)}
  .t-twilight{--thumb:linear-gradient(135deg,#fbbf24,#1e1b4b)}
  .t-sunset{--thumb:linear-gradient(135deg,#fb923c,#4c1d95)}
  .t-ocean{--thumb:linear-gradient(135deg,#22d3ee,#0c0a1f)}
  .t-night{--thumb:linear-gradient(135deg,#1e293b,#020617)}
  .t-forest{--thumb:linear-gradient(135deg,#34d399,#022c22)}
  .t-rust{--thumb:linear-gradient(135deg,#f97316,#451a03)}
  .t-orchid{--thumb:linear-gradient(135deg,#e879f9,#581c87)}

  .empty{display:none;padding:60px;text-align:center;color:var(--text-dim);font-size:15px}

  @media (max-width: 720px) {
    nav.topnav{padding:14px 20px}
    .nav-links{display:none}
    .page{padding:100px 20px 60px}
    .page-title{font-size:44px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-left">
    <a href="home.html" class="nf-logo">LOVE<span class="heart">♥</span>FLIX</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="browse.html" class="active">Browse</a>
      <a href="#">Our Story</a>
      <a href="#">My List</a>
    </div>
  </div>
  <div class="nav-right">
    <a href="whos_watching.html" class="nav-avatar">M</a>
  </div>
</nav>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">All Videos</h1>
      <p class="page-sub">86 videos · 14 hours of us · sorted by newest</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search" type="text" placeholder="Search videos..." />
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="trips">Trips</button>
    <button class="chip" data-cat="anniversary">Anniversary</button>
    <button class="chip" data-cat="birthdays">Birthdays</button>
    <button class="chip" data-cat="moments">Moments</button>
    <button class="chip" data-cat="letters">Letters</button>
    <button class="chip" data-cat="cooking">Cooking Together</button>
    <button class="chip" data-cat="favorites">♥ Favorites</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No videos match that.</div>
</main>

<script>
  const VIDEOS = [
    { t:'The Lisbon Trip · Day 3', cat:'trips', date:'May 2025', dur:'26:12', tint:'t-rose', fav:true },
    { t:'The Birthday Surprise', cat:'birthdays', date:'Aug 2024', dur:'12:04', tint:'t-amber', fav:true },
    { t:'Forest Picnic', cat:'moments', date:'Jun 2024', dur:'08:31', tint:'t-emerald', fav:false },
    { t:'Beach Sunrise', cat:'moments', date:'Apr 2024', dur:'04:15', tint:'t-coral', fav:true },
    { t:'Rooftop Anniversary', cat:'anniversary', date:'Feb 2024', dur:'18:22', tint:'t-violet', fav:true },
    { t:'Snowy Christmas', cat:'moments', date:'Dec 2023', dur:'14:08', tint:'t-blue', fav:false },
    { t:'Ep. 01 — The Coffee', cat:'moments', date:'May 2023', dur:'06:40', tint:'t-rose2', fav:false },
    { t:'Ep. 02 — First Walk', cat:'moments', date:'Jun 2023', dur:'09:11', tint:'t-twilight', fav:false },
    { t:'Ep. 03 — The Mixtape', cat:'letters', date:'Jul 2023', dur:'03:55', tint:'t-mauve', fav:true },
    { t:'Ep. 04 — I Love You', cat:'moments', date:'Sep 2023', dur:'05:22', tint:'t-sunset', fav:false },
    { t:'Ep. 05 — Moving In', cat:'moments', date:'Nov 2023', dur:'10:48', tint:'t-ocean', fav:false },
    { t:'Ep. 06 — The Question', cat:'anniversary', date:'Feb 2024', dur:'07:30', tint:'t-emerald', fav:true },
    { t:'Ep. 07 — Yes', cat:'anniversary', date:'Feb 2024', dur:'02:18', tint:'t-coral', fav:true },
    { t:'Surprise Proposal', cat:'anniversary', date:'Feb 2024', dur:'04:02', tint:'t-amber', fav:true },
    { t:'One Year Letter', cat:'letters', date:'May 2024', dur:'02:44', tint:'t-rose', fav:true },
    { t:'Dance in the Rain', cat:'moments', date:'Jul 2024', dur:'03:08', tint:'t-violet', fav:false },
    { t:'Ocean Vows', cat:'anniversary', date:'Aug 2024', dur:'05:55', tint:'t-blue2', fav:true },
    { t:'Stars in Joshua Tree', cat:'trips', date:'Oct 2024', dur:'07:14', tint:'t-night', fav:false },
    { t:'Sunset Bike Ride', cat:'moments', date:'Nov 2024', dur:'03:44', tint:'t-twilight', fav:false },
    { t:'Forest Cabin Weekend', cat:'trips', date:'Mar 2024', dur:'16:10', tint:'t-forest', fav:true },
    { t:'The Tram Ride · Lisbon', cat:'trips', date:'May 2025', dur:'11:22', tint:'t-rust', fav:false },
    { t:'Pastéis de Nata', cat:'cooking', date:'May 2025', dur:'05:48', tint:'t-amber', fav:false },
    { t:'Pasta Night Disaster', cat:'cooking', date:'Feb 2025', dur:'08:09', tint:'t-rose2', fav:false },
    { t:'The Pancake Tradition', cat:'cooking', date:'Jan 2025', dur:'04:38', tint:'t-twilight', fav:true },
    { t:'2nd Anniversary', cat:'anniversary', date:'May 2025', dur:'22:00', tint:'t-orchid', fav:true },
    { t:'Your 30th Birthday', cat:'birthdays', date:'Mar 2025', dur:'15:21', tint:'t-coral', fav:true },
    { t:'My Birthday Hike', cat:'birthdays', date:'Sep 2024', dur:'09:48', tint:'t-emerald', fav:false },
    { t:'Letter from Day 100', cat:'letters', date:'Aug 2023', dur:'01:48', tint:'t-mauve', fav:false },
    { t:'Letter from Day 365', cat:'letters', date:'May 2024', dur:'02:12', tint:'t-rose', fav:false },
    { t:'Iceland Northern Lights', cat:'trips', date:'Feb 2025', dur:'12:34', tint:'t-ocean', fav:true },
  ];

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');
  const filtersEl = document.getElementById('filters');
  let activeCat = 'all';

  function favIcon(on){
    return on
      ? '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.5 2.7 5 6.2 5c2 0 3.4 1.1 4.3 2.4C11.4 6.1 12.8 5 14.8 5c3.5 0 5.2 3.5 3.8 6.7C19.5 16.4 12 21 12 21z" fill="#e50914"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.5 2.7 5 6.2 5c2 0 3.4 1.1 4.3 2.4C11.4 6.1 12.8 5 14.8 5c3.5 0 5.2 3.5 3.8 6.7C19.5 16.4 12 21 12 21z" fill="rgba(255,255,255,0.85)"/></svg>';
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    const list = VIDEOS.filter(v => {
      const catOk = activeCat === 'all' ? true : (activeCat === 'favorites' ? v.fav : v.cat === activeCat);
      const qOk = !q || v.t.toLowerCase().includes(q);
      return catOk && qOk;
    });
    grid.innerHTML = list.map(v => `
      <article class="card ${v.tint}" onclick="location.href='player.html'">
        <div class="card-thumb">
          <span class="card-thumb-date">${v.date}</span>
          <span class="card-thumb-fav">${favIcon(v.fav)}</span>
          <span class="card-thumb-text">${v.t.replace(/ · /, '<br>')}</span>
          <span class="card-thumb-dur">${v.dur}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${v.t}</div>
          <div class="card-meta"><span class="card-cat">${v.cat}</span> · <span>${v.date}</span> · <span>${v.dur}</span></div>
        </div>
      </article>
    `).join('');
    empty.style.display = list.length ? 'none' : 'block';
  }

  filtersEl.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });
  search.addEventListener('input', render);

  render();
</script>
</body>
</html>
