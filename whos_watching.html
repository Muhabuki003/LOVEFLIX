  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {

  .bg-collage {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px; opacity: 0.18; filter: blur(2px);
    z-index: 0; transform: scale(1.05);
    pointer-events: none;
  }
  .bg-tile { position: relative; overflow: hidden; }
  .bg-tile::after { content: ''; position: absolute; inset: 0; background: var(--c); opacity: 0.6; }

  .t2  { --c: linear-gradient(135deg,#1a1a4e,#0d0d2b); }

  .t4  { --c: linear-gradient(135deg,#0e1a2d,#112240); }
  .t5  { --c: linear-gradient(135deg,#1a0a0a,#3d1515); }
  .t6  { --c: linear-gradient(135deg,#0d1b0d,#1a3a1a); }
  .t7  { --c: linear-gradient(135deg,#2b0d2b,#4a1a4a); }
  .t8  { --c: linear-gradient(135deg,#1a1000,#3d2d00); }
  .t9  { --c: linear-gradient(135deg,#0a0a1a,#1a1a3d); }
  .t10 { --c: linear-gradient(135deg,#1a0505,#3d0f0f); }
  .t11 { --c: linear-gradient(135deg,#05100a,#0f2d1a); }
  .t12 { --c: linear-gradient(135deg,#15051a,#2b0a3d); }

<script>
// ── Globe background: orbits around partner's last known location ─────────────
(function() {
  function parseWKB(hex) {
    if (!hex || hex.length < 42) return null;
    try {
      const buf  = new Uint8Array(hex.match(/../g).map(b => parseInt(b, 16)));
      const view = new DataView(buf.buffer);
      const le   = buf[0] === 1;
      const type = view.getUint32(1, le);
      const off  = (type & 0x20000000) ? 9 : 5;
      const lng  = view.getFloat64(off,     le);
      const lat  = view.getFloat64(off + 8, le);
      return (isFinite(lng) && isFinite(lat)) ? [lng, lat] : null;
    } catch(_) { return null; }
  }

  async function fetchPartnerCoords(sbUrl, sbKey, token, coupleId, myUserId) {
    try {
      const res = await fetch(
        `${sbUrl}/rest/v1/couple_locations?couple_id=eq.${coupleId}&select=user_id,location&order=updated_at.desc`,
        { headers: { apikey: sbKey, Authorization: `Bearer ${token}` } }
      );
      if (!res.ok) return null;
      const rows = await res.json();
      if (!Array.isArray(rows)) return null;
      for (const row of rows) {
        if (row.user_id !== myUserId) {
          const c = parseWKB(row.location);
          if (c) return c; // [lng, lat]
        }
      }
    } catch(_) {}
    return null;
  }

  function launchGlobe(center) {
    const container = document.getElementById('globe-bg');
    if (!container || typeof maplibregl === 'undefined') return;

    const map = new maplibregl.Map({
      container:         'globe-bg',
      style:             'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center:            center || [0, 20],
      zoom:              9.5,
      pitch:             60,
      bearing:           0,
      interactive:       false,
      attributionControl: false
    });

    map.on('style.load', function() {
      // Mercator gives the cinematic tilted-orbit look (same as loveconnect)
      try { map.setProjection({ type: 'mercator' }); } catch(_) {}

      if (center) {
        map.flyTo({ center: center, zoom: 9.5, pitch: 60, bearing: 0,
                    duration: 3200, essential: true });
      }

      // Start continuous bearing rotation ~2s after fly-in
      var bearing = 0;
      setTimeout(function() {
        (function loop() {
          bearing = (bearing + 0.09 + 360) % 360;
          map.setBearing(bearing);
          requestAnimationFrame(loop);
        })();
      }, center ? 3400 : 400);
    });
  }

  // Poll for maplibregl (loaded async) then fetch + start
  function tryStart() {
    if (typeof maplibregl === 'undefined') { setTimeout(tryStart, 120); return; }

    var lf        = typeof LoveFlix !== 'undefined' ? LoveFlix : null;
    var sbUrl     = lf ? lf.SUPABASE_URL    : null;
    var sbKey     = lf ? lf.SUPABASE_ANON_KEY : null;
    var token     = lf ? lf.getToken()      : null;
    var coupleId  = lf ? lf.getCoupleId()   : null;
    var myUserId  = lf ? lf.getUserId()     : null;

    if (sbUrl && token && coupleId && myUserId) {
      fetchPartnerCoords(sbUrl, sbKey, token, coupleId, myUserId)
        .then(function(coords) { launchGlobe(coords); });
    } else {
      launchGlobe(null); // no auth yet — default world view
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tryStart);
  } else {
    setTimeout(tryStart, 0);
  }
})();
</script>
<script>
(function() {
  'use strict';

  if (!LoveFlix.requireAuth()) return;

  function applyNames(settings) {
    const partnerName = settings.partnerName || 'My Love';
    const adminName   = settings.adminName   || 'You';

    document.getElementById('herInitial').textContent = (partnerName[0] || '?').toUpperCase();
    document.getElementById('herName').textContent    = partnerName;

    document.getElementById('hisInitial').textContent = (adminName[0] || '?').toUpperCase();
    document.getElementById('hisName').textContent    = adminName;

    const herAv   = document.querySelector('#herAvatarWrap .avatar');
    const herInit = document.getElementById('herInitial');
    if (herAv && settings.partnerPhoto) {
      herAv.style.background = 'url(' + JSON.stringify(settings.partnerPhoto) + ') center/cover no-repeat';
      herInit.style.color = 'transparent';
    } else if (herAv) {
      herAv.style.background = '';
      herInit.style.color = '';
    }

    const hisAv   = document.querySelector('#hisAvatarWrap .avatar');
    const hisInit = document.getElementById('hisInitial');
    if (hisAv && settings.adminPhoto) {
      hisAv.style.background = 'url(' + JSON.stringify(settings.adminPhoto) + ') center/cover no-repeat';
      hisInit.style.color = 'transparent';
    } else if (hisAv) {
      hisAv.style.background = '';
      hisInit.style.color = '';
    }
  }

  // Grant admin session flag so admin.html recognises the navigation intent.
  document.getElementById('adminBtn').addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('selectorPage').classList.add('fade-out');
    try { sessionStorage.setItem('loveflix_admin_authed', '1'); } catch (_) {}
    setTimeout(function() { window.location.href = 'admin.html'; }, 280);
  });

  // Apply the glow to whichever avatar belongs to the logged-in user,
  // and hide the Admin button if the logged-in user is a partner.
  function applyRoleUI() {
    const profile = LoveFlix.getActiveProfile();
    const isPartner = profile.dbRole === 'partner';
    document.getElementById('herAvatarWrap').classList.toggle('active', isPartner);
    document.getElementById('hisAvatarWrap').classList.toggle('active', !isPartner);
    document.getElementById('adminBtn').style.display = isPartner ? 'none' : '';
  }

  applyNames(LoveFlix.getSettings());
  applyRoleUI();

  // Re-apply after settings and couple cache have loaded.
  LoveFlix.ensureSettingsReady().then(function(s) { applyNames(s); applyRoleUI(); }).catch(function() {});
  LoveFlix.cacheCoupleId().then(applyRoleUI).catch(function() {});
  window.addEventListener('loveflix:settings-changed', function() { applyNames(LoveFlix.getSettings()); applyRoleUI(); });

  // Reflow on mobile: wrap the two deco avatars into a shared row so they
  // sit side-by-side above the buttons when the layout stacks vertically.
  function reflow() {
    const layout = document.getElementById('selectorLayout');
    const her    = document.getElementById('herAvatarWrap');
    const his    = document.getElementById('hisAvatarWrap');
    const nav    = layout.querySelector('.nav-center');
    const isMobile = window.innerWidth <= 640;
    let row = document.getElementById('decoProfilesRow');

    if (isMobile) {
      if (!row) {
        row = document.createElement('div');
        row.id = 'decoProfilesRow';
        row.className = 'deco-profiles';
        layout.insertBefore(row, nav);
      }
      if (!row.contains(her)) row.appendChild(her);
      if (!row.contains(his)) row.appendChild(his);
    } else {
      if (row) {
        // Restore desktop order: Her | Buttons | His
        layout.insertBefore(her, nav);
        layout.appendChild(his);
        row.remove();
      }
    }
  }

  reflow();
  window.addEventListener('resize', reflow);
})();
</script>
</body>
</html>
