name = "loveflix-chat"
main = "src/index.js"
compatibility_date = "2025-05-01"

# D1 database — create with:
#   wrangler d1 create loveflix-chat
# then paste the returned database_id below (replace REPLACE_WITH_YOUR_D1_ID).
[[d1_databases]]
binding = "DB"
database_name = "loveflix-chat"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Durable Object: one instance per couple room
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

