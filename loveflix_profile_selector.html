<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #141414; min-height: 100vh; overflow: hidden; }

  .bg-collage {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px; opacity: 0.2; filter: blur(2px);
    z-index: 0; transform: scale(1.05);
  }
  .bg-tile { position: relative; overflow: hidden; }
  .bg-tile::after { content: ''; position: absolute; inset: 0; background: var(--c); opacity: 0.6; }
  .t1  { --c: linear-gradient(135deg,#e50914,#831010); }
  .t2  { --c: linear-gradient(135deg,#1a1a4e,#0d0d2b); }
  .t3  { --c: linear-gradient(135deg,#2d1b0e,#5c3317); }
  .t4  { --c: linear-gradient(135deg,#0e1a2d,#112240); }
  .t5  { --c: linear-gradient(135deg,#1a0a0a,#3d1515); }
  .t6  { --c: linear-gradient(135deg,#0d1b0d,#1a3a1a); }
  .t7  { --c: linear-gradient(135deg,#2b0d2b,#4a1a4a); }
  .t8  { --c: linear-gradient(135deg,#1a1000,#3d2d00); }
  .t9  { --c: linear-gradient(135deg,#0a0a1a,#1a1a3d); }
  .t10 { --c: linear-gradient(135deg,#1a0505,#3d0f0f); }
  .t11 { --c: linear-gradient(135deg,#05100a,#0f2d1a); }
  .t12 { --c: linear-gradient(135deg,#15051a,#2b0a3d); }
  .t13 { --c: linear-gradient(135deg,#e50914,#831010); }
  .t14 { --c: linear-gradient(135deg,#0d0d3d,#1a1a5c); }
  .t15 { --c: linear-gradient(135deg,#1a0a00,#3d2000); }

  .bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1; }

  nav {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 24px 48px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nf-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px; color: #e50914;
    letter-spacing: 3px; line-height: 1;
  }
  .nf-logo .heart { color: #fff; font-size: 26px; vertical-align: middle; }

  /* PROFILE SELECTOR */
  .selector-page {
    position: relative; z-index: 5;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 48px;
    animation: fadeIn 0.5s ease forwards;
  }

  .selector-page h1 {
    font-size: 34px; font-weight: 400;
    color: #fff; letter-spacing: 0px;
    text-align: center;
  }

  .profiles-row {
    display: flex; gap: 32px;
    align-items: flex-start; justify-content: center;
  }

  .profile-card {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    cursor: pointer;
  }

  .profile-avatar {
    width: 160px; height: 160px;
    border-radius: 8px;
    border: 3px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
    position: relative; overflow: hidden;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }

  .profile-card:hover .profile-avatar {
    border-color: #fff;
    transform: scale(1.04);
  }

  .profile-avatar .initials {
    font-size: 64px; font-weight: 700;
    color: #fff; opacity: 0.9;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
  }

  .profile-avatar .emoji-bg {
    font-size: 80px; line-height: 1;
  }

  .her-avatar { --bg: linear-gradient(135deg, #c2185b, #880e4f); }
  .his-avatar { --bg: linear-gradient(135deg, #1565c0, #0d47a1); }

  .profile-name {
    font-size: 16px; color: #e5e5e5;
    font-weight: 400; letter-spacing: 0.3px;
    transition: color 0.15s;
    text-align: center;
  }
  .profile-card:hover .profile-name { color: #fff; }

  .manage-btn {
    font-size: 15px; color: #999;
    font-weight: 400; letter-spacing: 1.5px;
    border: 1px solid #999; padding: 10px 28px;
    cursor: pointer; background: transparent;
    font-family: 'Inter', sans-serif;
    transition: color 0.15s, border-color 0.15s;
    text-transform: uppercase;
  }
  .manage-btn:hover { color: #fff; border-color: #fff; }

  /* PIN OVERLAY */
  .pin-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    animation: fadeIn 0.2s ease forwards;
  }
  .pin-overlay.show { display: flex; }

  .pin-overlay h2 {
    font-size: 28px; font-weight: 500;
    color: #fff; text-align: center;
  }
  .pin-overlay p {
    font-size: 15px; color: #999;
    margin-top: -20px; text-align: center;
  }

  .pin-dots {
    display: flex; gap: 16px;
    align-items: center; justify-content: center;
  }

  .pin-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #555;
    background: transparent;
    transition: all 0.15s;
  }
  .pin-dot.filled { background: #e50914; border-color: #e50914; }
  .pin-dot.error  { background: #e87c03; border-color: #e87c03; }
  .pin-dot.success { background: #2d7a3a; border-color: #2d7a3a; }

  .pin-grid {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(4, 70px);
    gap: 10px;
  }

  .pin-key {
    background: #2a2a2a;
    border: none; border-radius: 6px;
    color: #fff; font-size: 22px;
    font-weight: 500; font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-key:hover { background: #3d3d3d; }
  .pin-key:active { transform: scale(0.94); background: #555; }
  .pin-key.del { font-size: 16px; color: #aaa; }
  .pin-key.empty { background: transparent; cursor: default; pointer-events: none; }

  .pin-error-msg {
    font-size: 14px; color: #e87c03;
    text-align: center; min-height: 20px;
    transition: opacity 0.2s;
  }

  .pin-cancel {
    font-size: 14px; color: #999;
    cursor: pointer; text-decoration: underline;
    background: none; border: none;
    font-family: 'Inter', sans-serif;
    transition: color 0.15s;
  }
  .pin-cancel:hover { color: #fff; }

  /* SUCCESS FLASH */
  .success-screen {
    position: fixed; inset: 0;
    background: #141414;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .success-screen.show { display: flex; }
  .success-screen .welcome-text {
    font-size: 28px; color: #fff; font-weight: 300;
    animation: fadeIn 0.4s ease forwards;
  }
  .success-screen .welcome-name {
    font-size: 48px; color: #e50914;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    animation: fadeIn 0.4s 0.2s ease both;
  }
  .success-screen .loading-bar-wrap {
    width: 200px; height: 3px;
    background: #333; border-radius: 2px;
    overflow: hidden; margin-top: 16px;
    animation: fadeIn 0.4s 0.3s ease both;
  }
  .loading-bar {
    height: 100%; width: 0%;
    background: #e50914; border-radius: 2px;
    transition: width 2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<div class="bg-collage">
  <div class="bg-tile t1"></div><div class="bg-tile t2"></div><div class="bg-tile t3"></div>
  <div class="bg-tile t4"></div><div class="bg-tile t5"></div><div class="bg-tile t6"></div>
  <div class="bg-tile t7"></div><div class="bg-tile t8"></div><div class="bg-tile t9"></div>
  <div class="bg-tile t10"></div><div class="bg-tile t11"></div><div class="bg-tile t12"></div>
  <div class="bg-tile t13"></div><div class="bg-tile t14"></div><div class="bg-tile t15"></div>
</div>
<div class="bg-overlay"></div>

<nav>
  <span class="nf-logo">LOVE<span class="heart">♥</span>FLIX</span>
</nav>

<!-- PROFILE SELECTOR -->
<div class="selector-page" id="selectorPage">
  <h1>Who's watching?</h1>

  <div class="profiles-row">

    <!-- HER PROFILE -->
    <div class="profile-card" onclick="selectHer()">
      <div class="profile-avatar her-avatar">
        <span class="emoji-bg">🌸</span>
      </div>
      <span class="profile-name" id="herName">Her Name</span>
    </div>

    <!-- HIS PROFILE (ADMIN) -->
    <div class="profile-card" onclick="selectHim()">
      <div class="profile-avatar his-avatar">
        <span class="initials">B</span>
      </div>
      <span class="profile-name" id="hisName">Buki</span>
    </div>

  </div>

  <button class="manage-btn">Manage Profiles</button>
</div>

<!-- PIN OVERLAY -->
<div class="pin-overlay" id="pinOverlay">
  <h2>Enter your PIN</h2>
  <p>Admin access — LoveFlix Studio</p>

  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>

  <div class="pin-grid" id="pinGrid">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key del" onclick="pinDelete()">⌫</button>
  </div>

  <div class="pin-error-msg" id="pinError"></div>
  <button class="pin-cancel" onclick="closePin()">← Back to profiles</button>
</div>

<!-- SUCCESS / LOADING SCREEN -->
<div class="success-screen" id="successScreen">
  <p class="welcome-text">Welcome back,</p>
  <p class="welcome-name" id="successName">Her Name</p>
  <div class="loading-bar-wrap">
    <div class="loading-bar" id="loadingBar"></div>
  </div>
</div>

<script>
  const CORRECT_PIN = '1234';
  let pinValue = '';
  let pinLocked = false;

  function selectHer() {
    const name = document.getElementById('herName').textContent;
    showSuccess(name, false);
  }

  function selectHim() {
    document.getElementById('pinOverlay').classList.add('show');
    pinValue = '';
    pinLocked = false;
    updateDots();
    document.getElementById('pinError').textContent = '';
  }

  function closePin() {
    document.getElementById('pinOverlay').classList.remove('show');
    pinValue = '';
    updateDots();
    document.getElementById('pinError').textContent = '';
  }

  function pinPress(num) {
    if (pinLocked || pinValue.length >= 4) return;
    pinValue += num;
    updateDots();
    if (pinValue.length === 4) {
      setTimeout(checkPin, 180);
    }
  }

  function pinDelete() {
    if (pinLocked) return;
    pinValue = pinValue.slice(0, -1);
    updateDots();
    document.getElementById('pinError').textContent = '';
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot' + i);
      dot.className = 'pin-dot';
      if (i < pinValue.length) dot.classList.add('filled');
    }
  }

  function checkPin() {
    if (pinValue === CORRECT_PIN) {
      for (let i = 0; i < 4; i++) {
        document.getElementById('dot' + i).className = 'pin-dot success';
      }
      setTimeout(() => {
        closePin();
        showSuccess('Buki', true);
      }, 600);
    } else {
      pinLocked = true;
      for (let i = 0; i < 4; i++) {
        document.getElementById('dot' + i).className = 'pin-dot error';
      }
      document.getElementById('pinGrid').classList.add('shake');
      document.getElementById('pinError').textContent = 'Wrong PIN. Try again.';
      setTimeout(() => {
        pinValue = '';
        pinLocked = false;
        updateDots();
        document.getElementById('pinGrid').classList.remove('shake');
      }, 900);
    }
  }

  function showSuccess(name, isAdmin) {
    // persist auth state BEFORE navigating so the destination sees it
    try {
      sessionStorage.setItem('loveflix_profile', name);
      sessionStorage.setItem('loveflix_is_admin', isAdmin ? '1' : '0');
      if (isAdmin) sessionStorage.setItem('loveflix_admin_authed', '1');
    } catch (_) { /* storage disabled — still navigate */ }

    const screen = document.getElementById('successScreen');
    document.getElementById('successName').textContent = name;
    screen.classList.add('show');
    requestAnimationFrame(() => {
      document.getElementById('loadingBar').style.width = '100%';
    });
    setTimeout(() => {
      document.getElementById('successName').textContent = isAdmin
        ? name + ' — Admin'
        : name;
    }, 200);

    // wait for the loading bar to fill (2s CSS transition), then route
    const target = isAdmin ? 'admin.html' : 'home.html';
    setTimeout(() => { window.location.href = target; }, 2100);
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('pinOverlay').classList.contains('show')) return;
    if (e.key >= '0' && e.key <= '9') pinPress(e.key);
    if (e.key === 'Backspace') pinDelete();
    if (e.key === 'Escape') closePin();
  });
</script>
</body>
</html>
