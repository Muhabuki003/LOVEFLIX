<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<script src="/assets/posthog.js" defer></script>
<title>LoveFlix — My List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#141414;--red:#e50914;--text-dim:#a3a3a3;--text-light:#d4d4d4}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}

  .page{padding:120px 48px 80px;max-width:1600px;margin:0 auto}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:32px}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:2px;line-height:1}
  .page-sub{font-size:14px;color:var(--text-dim);margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}

  .card{
    border-radius:6px;overflow:hidden;background:#1f1f1f;cursor:pointer;
    transition:transform .25s ease,box-shadow .25s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,0.5)}

  .card-thumb{aspect-ratio:16/9;background:var(--thumb,linear-gradient(135deg,#444,#222));position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}
  .card-thumb-text{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:rgba(255,255,255,0.92);text-shadow:0 2px 12px rgba(0,0,0,0.5);line-height:1.05}
  .card-thumb-date{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.4);padding:3px 7px;border-radius:2px}
  .card-thumb-fav{position:absolute;top:10px;right:12px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);border-radius:50%;transition:transform .15s ease,background .15s ease}
  .card-thumb-fav:hover{transform:scale(1.18);background:rgba(0,0,0,0.7)}
  .card-thumb-fav svg{width:16px;height:16px}
  .card-thumb-dur{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.65);color:#fff;font-size:11px;font-weight:500;padding:2px 7px;border-radius:2px}

  .card-body{padding:14px 14px 16px}
  .card-title{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.3}
  .card-meta{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-cat{color:var(--red);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:10px}

  /* tints */
  .t-rose{--thumb:linear-gradient(135deg,#ff7aa2,#5a0a23)}
  .t-rose2{--thumb:linear-gradient(135deg,#d6336c,#4a0e2c)}
  .t-blue{--thumb:linear-gradient(135deg,#3a7bff,#1e3a8a)}
  .t-blue2{--thumb:linear-gradient(135deg,#0ea5e9,#082f49)}
  .t-violet{--thumb:linear-gradient(135deg,#a855f7,#2e1065)}
  .t-amber{--thumb:linear-gradient(135deg,#f59e0b,#6b3a02)}
  .t-emerald{--thumb:linear-gradient(135deg,#10b981,#064e3b)}
  .t-coral{--thumb:linear-gradient(135deg,#ff8c69,#3d0f08)}
  .t-mauve{--thumb:linear-gradient(135deg,#c084fc,#2e0a4d)}
  .t-twilight{--thumb:linear-gradient(135deg,#fbbf24,#1e1b4b)}
  .t-sunset{--thumb:linear-gradient(135deg,#fb923c,#4c1d95)}
  .t-ocean{--thumb:linear-gradient(135deg,#22d3ee,#0c0a1f)}
  .t-night{--thumb:linear-gradient(135deg,#1e293b,#020617)}
  .t-forest{--thumb:linear-gradient(135deg,#34d399,#022c22)}
  .t-rust{--thumb:linear-gradient(135deg,#f97316,#451a03)}
  .t-orchid{--thumb:linear-gradient(135deg,#e879f9,#581c87)}

  .empty{
    display:none;
    padding:80px 24px;
    text-align:center;
  }
  .empty-heart{font-size:56px;margin-bottom:20px;opacity:.35}
  .empty-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--text-dim);margin-bottom:12px}
  .empty-sub{font-size:15px;color:var(--text-dim);line-height:1.6;max-width:400px;margin:0 auto 28px}
  .empty-cta{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--red);color:#fff;
    padding:12px 28px;border-radius:4px;font-size:15px;font-weight:600;
    transition:filter .18s ease;
  }
  .empty-cta:hover{filter:brightness(1.15)}

  @media(max-width:900px){.page{padding:110px 24px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}}
  @media(max-width:720px){
    .page{padding:90px 16px 50px}
    .page-title{font-size:40px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .card-thumb-text{font-size:18px}
    .card-body{padding:10px 10px 12px}
    .card-title{font-size:13px}
  }
  @media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>
<body>

<div id="site-nav"></div>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">My List</h1>
      <p class="page-sub" id="pageSub">Loading…</p>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="empty-heart">♥</div>
    <div class="empty-title">Nothing saved yet</div>
    <p class="empty-sub">Start hearting videos you love and they'll show up here — your personal collection of the moments that matter most.</p>
    <a href="browse.html" class="empty-cta">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
      Browse Videos
    </a>
  </div>
</main>

<script src="assets/loveflix.js"></script>
<script src="assets/loveflix-nav.js"></script>
<script src="assets/loveflix-call.js"></script>
<script>
  if (!LoveFlix.requireAuth()) throw new Error('redirecting');

  const TINTS = ['t-rose','t-rose2','t-blue','t-blue2','t-violet','t-amber','t-emerald','t-coral','t-mauve','t-twilight','t-sunset','t-ocean','t-night','t-forest','t-rust','t-orchid'];
  function tintFor(id) {
    let h = 0;
    for (let i = 0; i < (id || '').length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
    return TINTS[Math.abs(h) % TINTS.length];
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function safeCssUrl(url) {
    if (!url || typeof url !== 'string') return null;
    if (!/^https?:\/\//i.test(url)) return null;
    return url.replace(/'/g,'%27').replace(/\)/g,'%29').replace(/\\/g,'%5C');
  }
  function fmtDur(sec) {
    if (!sec) return '—';
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const pageSub = document.getElementById('pageSub');

  let VIDEOS = [];

  function heartFilledSvg() {
    return '<svg viewBox="0 0 24 24" style="fill:#e50914"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.5 2.7 5 6.2 5c2 0 3.4 1.1 4.3 2.4C11.4 6.1 12.8 5 14.8 5c3.5 0 5.2 3.5 3.8 6.7C19.5 16.4 12 21 12 21z"/></svg>';
  }

  function render() {
    if (!VIDEOS.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      pageSub.textContent = 'No saved videos yet.';
      return;
    }
    empty.style.display = 'none';
    pageSub.textContent = `${VIDEOS.length} saved video${VIDEOS.length === 1 ? '' : 's'}`;
    grid.innerHTML = VIDEOS.map(v => {
      const tintClass = v.thumbnail_url ? '' : tintFor(v.id);
      const safeThumb = safeCssUrl(v.thumbnail_url);
      const thumbStyle = safeThumb ? `style="background:url('${safeThumb}') center/cover no-repeat"` : '';
      const titleHtml = escapeHtml(v.title || 'Untitled').replace(/ · /, '<br>');
      const dur = fmtDur(v.duration_seconds);
      const cat = v.category || 'Moments';
      const date = v.date || '';
      return `
      <article class="card ${tintClass}" data-id="${escapeHtml(v.id)}">
        <div class="card-thumb" ${thumbStyle}>
          <span class="card-thumb-date">${escapeHtml(date)}</span>
          <button class="card-thumb-fav" data-vid="${escapeHtml(v.id)}" title="Remove from My List" aria-label="Remove from My List">
            ${heartFilledSvg()}
          </button>
          ${v.thumbnail_url ? '' : `<span class="card-thumb-text">${titleHtml}</span>`}
          <span class="card-thumb-dur">${dur}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(v.title || 'Untitled')}</div>
          <div class="card-meta"><span class="card-cat">${escapeHtml(cat)}</span> · <span>${escapeHtml(date || '—')}</span> · <span>${dur}</span></div>
        </div>
      </article>`;
    }).join('');
  }

  grid.addEventListener('click', async e => {
    const favBtn = e.target.closest('.card-thumb-fav');
    if (favBtn) {
      e.stopPropagation();
      const vid = favBtn.dataset.vid;
      try {
        await LoveFlix.api(`/api/favorites/${encodeURIComponent(vid)}`, { method: 'DELETE' });
        VIDEOS = VIDEOS.filter(v => v.id !== vid);
        render();
      } catch (err) {
        console.error('Failed to remove from favorites:', err);
      }
      return;
    }
    const card = e.target.closest('.card');
    if (card) {
      location.href = `player.html?id=${encodeURIComponent(card.dataset.id)}`;
    }
  });

  async function load() {
    try {
      const r = await LoveFlix.api('/api/favorites');
      VIDEOS = r.videos || [];
    } catch (e) {
      pageSub.textContent = "Couldn't load your list: " + e.message;
      empty.style.display = 'block';
      return;
    }
    render();
  }
  load();
</script>
</body>
</html>
